# Batch plan — full-schema example
# Load with: tcb batch load docs/batch-plan.example.yml
# See docs/manual.md §8 for command reference.

# Unique plan identifier (used in tcb batch start / export).
id: nightly-review

# Human-readable name shown in status output.
name: Nightly Review

# Agent concurrency caps. At least one agent must be listed.
# claude: max simultaneous Claude sessions admitted from this run.
# codex: max simultaneous Codex sessions admitted from this run.
pools:
  claude: 2
  codex: 1

# When to fire this plan. Omit to use `tcb batch start <id>` manually.
# Supported kinds: now | at | cron
#
# "now"  — fire once on the next scheduler tick after loading.
# "at"   — fire once at a specific epoch-millisecond timestamp.
# "cron" — recurring; five-field cron expression (min hour dom month dow).
#
# Cron note: expressions are evaluated in UTC.
# dom AND dow must BOTH match (they are ANDed, not ORed — non-standard vs.
# vixie cron). Use "*" in whichever field you don't care about.
#
# Example below fires every night at 02:00 UTC, Monday–Friday.
schedule:
  kind: cron
  cron: "0 2 * * 1-5"

# Default task settings applied to every project unless overridden per-project.
defaults:
  rounds: 1    # number of agent rounds per goal phase
  retries: 1   # how many times to retry a failed task before marking it failed

# List of projects to run. At least one project is required.
# Each entry runs the listed goals in order on the given project path.
#
# Valid goal ids (built-in): fix-tests | code-review | test-coverage |
#                            add-feature | refactor-elegant | ui-polish
projects:
  - path: /path/to/projects/api-service
    agent: claude
    goals:
      - fix-tests
      - code-review
    # priority: higher values are admitted first (default 0).
    priority: 10

  - path: /path/to/projects/frontend
    agent: codex
    goals:
      - code-review
    # Per-project overrides take precedence over defaults above.
    rounds: 2
    retries: 0
    priority: 5
