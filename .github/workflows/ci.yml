name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      # The deploy target is macOS (launchd, mlx_whisper, tmux quirks), so
      # verify on both: ubuntu for speed, macos to match production.
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: shellcheck --severity=warning install.sh dev.sh scripts/*.sh
      - run: npx biome check .
      - run: npx tsc --noEmit
      - run: npx tsc -p tsconfig.tests.json --noEmit
      - run: npx vitest run --coverage
      - uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - run: npx knip
      - run: npx depcruise src --config .dependency-cruiser.cjs
