name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Read-only: every job here just checks out and runs tooling — nothing writes
# back to the repo. Least-privilege GITHUB_TOKEN (codecov uploads via its own
# secret, not the workflow token).
permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      # The deploy target is macOS (launchd, mlx_whisper, tmux quirks), so
      # verify on both: ubuntu for speed, macos to match production.
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Dependency vulnerability scan. Platform-independent, so ubuntu-only.
      - run: npm audit --audit-level=high
        if: matrix.os == 'ubuntu-latest'
      # Not preinstalled on the macOS runner image, and the lint result is
      # platform-independent anyway — once on ubuntu is enough.
      - run: shellcheck --severity=warning install.sh dev.sh scripts/*.sh
        if: matrix.os == 'ubuntu-latest'
      - run: npx biome check .
      - run: npx tsc --noEmit
      - run: npx tsc -p tsconfig.tests.json --noEmit
      - run: npx vitest run --coverage
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        if: matrix.os == 'ubuntu-latest'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - run: npx knip
      - run: npx depcruise src --config .dependency-cruiser.cjs
      # Deep type-aware lint. Gates on the async-hygiene errors (floating /
      # misused promises); the dead-condition rule is warn-only, so a codebase
      # with only warnings still exits 0 and passes. Platform-independent.
      - run: npm run lint:deep
        if: matrix.os == 'ubuntu-latest'

  # Stable name for the branch-protection required check: stays "verify"
  # no matter how the matrix above evolves.
  verify:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All matrix checks passed
        run: test "${{ needs.checks.result }}" = "success"
