name: Scorecard

# OpenSSF Scorecard — audits the repo's security posture (branch protection,
# pinned deps, dangerous workflow patterns, token permissions, ...) and scores
# it 0-10. Results upload to the Security tab and feed the README badge via the
# public api.securityscorecards.dev endpoint.
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "31 5 * * 1"
  workflow_dispatch: # allow on-demand re-scans

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to the Security tab
      id-token: write # publish results so the public badge can read them
      contents: read # read repo files — needed by Dangerous-Workflow
      actions: read # read workflow files — needed by Token-Permissions
      # NOTE: a job-level permissions block replaces (does not merge with) the
      # top-level read-all, so contents/actions read must be listed explicitly.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # No floating @v2 tag exists; pin to a released commit SHA (Scorecard's
      # own recommendation, and it scores Pinned-Dependencies on itself).
      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true # required for the README badge to resolve
          # Read-only admin PAT so the Branch-Protection check can read main's
          # protection rules (the default GITHUB_TOKEN lacks admin read).
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
      - uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.36.2
        with:
          sarif_file: results.sarif
