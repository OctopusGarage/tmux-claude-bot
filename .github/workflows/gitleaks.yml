name: Gitleaks

# Secret scanning — fails the build if a credential-shaped string lands in the
# tree or history (bot tokens, app secrets, keys). Complements the runtime
# redaction in src/shared/utils/logger.ts.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: the scan only checks out history and runs the gitleaks CLI.
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so a secret in any commit is caught
      # Run the gitleaks CLI directly (MIT, free). The gitleaks-action@v2 wrapper
      # refuses to run on organization repos without a paid GITLEAKS_LICENSE, so
      # it never actually scanned here — the CLI has no such gate.
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact -v
