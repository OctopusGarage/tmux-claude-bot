name: Mutation

# Mutation testing is slow (it re-runs the covering tests per mutant), so it is
# NOT in the per-push CI. It runs weekly and on demand to surface "executed but
# unasserted" gaps (tests that run a line without asserting its behaviour).
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

# Read-only: checkout + run mutation tests + upload an artifact; no repo writes.
permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mutation
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
