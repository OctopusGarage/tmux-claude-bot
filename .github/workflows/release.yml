name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
  id-token: write # keyless cosign signing of release artifacts (Sigstore OIDC)
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # full history + tags so the changelog can diff against the previous tag
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REPO="OctopusGarage/tmux-claude-bot"
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"

          {
            echo "## Changes"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s' "${PREV}..${TAG}" | grep -v '^- release:' || true
            else
              git log --no-merges --pretty='- %s' "${TAG}" | grep -v '^- release:' || true
            fi
            echo
            echo "## Install / update (macOS)"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${REPO}/main/install.sh | bash"
            echo '```'
            echo
            echo "Pin this version with \`TMUX_CLAUDE_BOT_VERSION=${TAG}\`. See [CONTRIBUTING.md](https://github.com/${REPO}/blob/main/CONTRIBUTING.md) for dev, deploy, and release."
            echo
            echo "## Verify the signature (optional)"
            echo
            echo "The runtime tarball is keyless-signed with [Sigstore](https://docs.sigstore.dev/). Verify it with [cosign](https://github.com/sigstore/cosign):"
            echo
            echo '```bash'
            echo "cosign verify-blob tmux-claude-bot-${TAG}.tar.gz \\"
            echo "  --signature tmux-claude-bot-${TAG}.tar.gz.sig \\"
            echo "  --certificate tmux-claude-bot-${TAG}.tar.gz.pem \\"
            echo "  --certificate-identity-regexp 'https://github.com/${REPO}/.github/workflows/release.yml@.*' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            echo "Prefer an AI assistant? Paste this to ChatGPT / Claude / Gemini (or a shell agent):"
            echo
            echo '```text'
            echo 'Install "tmux-claude-bot" on my Mac for me (open-source, macOS-only). Download the latest'
            echo "release tarball from https://github.com/${REPO}/releases/latest, extract it, read the"
            echo 'INSTALL.md inside, and follow it. Guide me step by step and ask me for anything it needs'
            echo '(like my Telegram bot token).'
            echo '```'
            if [ -n "$PREV" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV}...${TAG}"
            fi
          } > release-notes.md

          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md

          # Attach a lean runtime tarball: source + scripts + manifests only — no
          # tests, CI, lint configs, or docs. The installer extracts this (not the
          # full source archive) and installs with --omit=dev.
          STAGE="tmux-claude-bot-${TAG}"
          git archive --format=tar.gz --prefix="${STAGE}/" "$TAG" \
            src scripts package.json package-lock.json .env.example tsconfig.json tsup.config.ts README.md INSTALL.md install.sh requirements.txt \
            -o "${STAGE}.tar.gz"
          gh release upload "$TAG" "${STAGE}.tar.gz"

          # Keyless-sign the tarball with Sigstore (Fulcio short-lived cert +
          # Rekor transparency log; signer identity = this workflow's OIDC
          # token). Attaching the .sig + .pem lets consumers run
          # `cosign verify-blob` to verify the release tarball's provenance.
          cosign sign-blob --yes "${STAGE}.tar.gz" \
            --output-signature "${STAGE}.tar.gz.sig" \
            --output-certificate "${STAGE}.tar.gz.pem"
          gh release upload "$TAG" "${STAGE}.tar.gz.sig" "${STAGE}.tar.gz.pem"
