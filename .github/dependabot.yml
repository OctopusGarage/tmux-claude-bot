version: 2
updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR per week for all minor/patch bumps. All Dependabot PRs target dev
      # and auto-merge there once CI is green; main stays manually promoted.
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions versions used in workflows
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
