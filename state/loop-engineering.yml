scheduler:
  jitter:
    enabled: true
    seed: local-stable
    architectureMaxDelayMinutes: 10
    bugFixMaxDelayMinutes: 20
    testCoverageMaxDelayMinutes: 20
    securityMaintenanceMaxDelayMinutes: 20
    harnessAutoMaxDelayMinutes: 20
    opportunityDiscoveryMaxDelayMinutes: 20
    pullRequestReviewMaxDelayMinutes: 30
    repositoryPullRequestReviewMaxDelayMinutes: 30
skills:
  applyCommand: sh /Users/kingsonwu/.tmux-claude-bot/state/loop-skill-apply-local.sh
  approved:
    - id: improve-codebase-architecture
      sourceUrl: https://github.com/mattpocock/skills/blob/main/skills/engineering/improve-codebase-architecture/SKILL.md
      ref: pinned-local-20260716
      checksum: local-installed
      platforms:
        - claude
        - codex
      tags:
        - architecture
        - refactor
      trustLevel: approved
      risk: medium
      updatePolicy: manual
projects:
  - id: geo-backend
    name: geo-backend
    path: /Users/kingsonwu/programming/miao2016/realestate/geo-backend
    agent: codex
    worktreeIsolation: isolated
    runner:
      kind: agent-supervised
      timeoutMs: 7200000
      maxTurns: 20
      requireConfirmation: false
    goal: >
      Use improve-codebase-architecture to keep the Geo backend architecture
      improving in small, verified, reviewable slices.
    maxRounds: 3
    targetScore: 95
    assessment:
      command: node /Users/kingsonwu/.tmux-claude-bot/state/loop-geo-backend-assess.mjs
    preflight:
      commands:
        - test -x .venv/bin/ruff
        - test -x .venv/bin/pyright
        - test -x .venv/bin/pytest
      repair:
        agent: true
        prompt: >
          Repair the Geo backend local Python environment using this
          repository's own setup docs and scripts. Read CLAUDE.md and README.md
          first. Prefer the project-owned setup path and do not continue
          architecture work until preflight passes.
    execution:
      agent: true
    recovery:
      agent: true
      dirtyWorktree: true
      maxAttempts: 1
    eval:
      agent: true
      minScore: 95
    commit:
      enabled: true
      perRound: true
      branch: loop/geo-backend/architecture
    pullRequest:
      enabled: true
      base: main
      switchBack: main
      githubAccount: miao2016
    bugFix:
      enabled: true
      schedule: 10 12 * * *
      branch: loop/geo-backend/bug-fix
      maxRounds: 5
      maxBugsPerRound: 2
      requireRegressionTest: true
      prompt: >
        Find and fix only confirmed production-risk bugs. Prioritize API
        contracts, persistence consistency, authorization, concurrency,
        scheduling/state handling, and error-handling bugs. Do not add features
        or perform architecture cleanup.
    testCoverage:
      enabled: true
      schedule: 10 15 * * *
      branch: loop/geo-backend/test-coverage
      targetCoverage: 80
      maxRounds: 5
      requireMeaningfulTests: true
      allowIntegrationTests: true
      allowSmokeTests: true
      allowE2ETests: true
      allowAiEvalTests: false
      prompt: >
        Raise meaningful test coverage to at least 80%. First inspect the
        existing Python test stack, coverage command/report, uncovered API
        contracts, persistence consistency, authorization, concurrency,
        scheduling/state handling, and error-handling paths. Add tests only for
        real behavior and plausible regressions; do not add weak tests purely to
        move the metric. If coverage work exposes a real bug, confirm it, fix it
        narrowly, and add regression coverage when practical.
    securityMaintenance:
      enabled: true
      riskAssessment:
        command: "node \"$LOOP_BOT_ROOT/scripts/loop-security-risk-assess.mjs\""
        actionThreshold: 70
        criticalThreshold: 90
      schedule: 10 16 * * *
      branch: loop/geo-backend/security-maintenance
      maxRounds: 3
      allowDependencyUpdates: true
      allowConfigHardening: true
      allowStaticAnalysisFixes: true
      prompt: >
        Automatically check and fix confirmed security risks. Include dependency
        advisories, GitHub security findings, static analysis, secrets, auth and
        permission boundaries, webhooks, CORS, file/path handling, uploads,
        command execution, sensitive logging, CI secrets, and supply-chain
        issues. First judge reachability and severity; do not blindly upgrade
        dependencies or harden config unless the risk is real or plausibly
        reachable.
    pullRequestReview:
      enabled: true
      schedule: 0 1 * * *
      lookbackHours: 48
      consecutivePasses: 2
      autoMerge: true
      prompt: >
        Carefully review loop-created PRs from the previous day. Run two
        independent passes. Do not nitpick; focus on introduced bugs, broken
        tests, CI failures, mergeability, data loss, security, migrations, and
        user-visible regressions. If both passes find no real issue and CI is
        green, merge the PR, switch back to the configured base branch, and
        fast-forward the local branch.
    allowedActions:
      - tests
      - docs
      - small-refactor
      - dependency-upgrade
    blockedActions:
      - direct-model-api
      - broad-rewrite
    selfImprovement:
      enabled: true
      maxItemsPerRun: 3
    enabled: true
